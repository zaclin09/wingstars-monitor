name: Wing Stars Monitor

on:
  schedule:
    - cron: '*/30 * * * *'  # 每 30 分鐘（GHA 實際延遲 5-30 分）
  workflow_dispatch:
    inputs:
      seed_mode:
        description: 'Seed mode (只入 DB，不推 Telegram)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: wingstars-monitor
  cancel-in-progress: false  # 讓上一輪跑完，不砍它

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write  # 為了 commit 更新過的 wingstars.db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.49.1

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Restore Threads session from secret
        run: |
          mkdir -p data
          echo "${{ secrets.THREADS_SESSION_B64 }}" | base64 -d > data/threads_session.json
          ls -l data/threads_session.json

      - name: Run monitor
        env:
          WINGSTARS_BOT_TOKEN: ${{ secrets.WINGSTARS_BOT_TOKEN }}
          WINGSTARS_CHAT_ID: ${{ secrets.WINGSTARS_CHAT_ID }}
        run: |
          if [ "${{ inputs.seed_mode }}" = "true" ]; then
            echo "=== SEED mode ==="
            python wingstars_monitor.py --seed
          else
            python wingstars_monitor.py
          fi

      - name: Commit updated DB
        if: always()  # 即使 monitor 失敗也 commit（可能已推部分成功）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wingstars.db 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No DB changes to commit"
          else
            git commit -m "auto: update wingstars.db [skip ci]"
            git push
          fi
